name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-publication
  cancel-in-progress: false
  queue: max

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag and publish source release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          notes=$(mktemp)
          trap 'rm -f -- "$notes"' EXIT
          bash scripts/release-notes.sh "$RELEASE_TAG" CHANGELOG.md > "$notes"
          tag_ref="refs/tags/$RELEASE_TAG"
          if [[ $(git cat-file -t "$tag_ref") != tag ]]; then
            echo 'Release tags must be annotated.' >&2
            exit 1
          fi
          tag_commit=$(git rev-parse "$tag_ref^{commit}")
          if [[ $tag_commit != "$(git rev-parse HEAD)" || $tag_commit != "$(git rev-parse "$RELEASE_SHA^{commit}")" ]]; then
            echo 'Release tag must target the exact checked-out event commit.' >&2
            exit 1
          fi
          git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main || {
            echo 'Release commit must be an ancestor of origin/main.' >&2
            exit 1
          }
          if existing=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft); then
            if [[ $existing == false ]]; then
              echo "Release $RELEASE_TAG is already published; leaving it unchanged."
              exit 0
            fi
            echo 'A draft release already exists; resolve it before rerunning.' >&2
            exit 1
          fi
          if [[ $RELEASE_TAG == *-* ]]; then
            set -- --prerelease --latest=false
          else
            latest=$(bash scripts/release-latest.sh "$RELEASE_TAG")
            set -- "--latest=$latest"
          fi
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file "$notes" "$@"
